<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAQL Optimizer</title>
  <style>
    :root {
      --bg: #121212; --panel: #1e1e1e; --text: #e0e0e0;
      --accent: #bb86fc; --border: #333; --success: #03dac6;
      --error: #cf6679;
    }
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg); color: var(--text); display: flex; flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 15px 25px; background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 500; color: var(--accent); }
    .container {
      display: flex; flex: 1; overflow: hidden;
    }
    .pane {
      flex: 1; display: flex; flex-direction: column; padding: 20px;
      border-right: 1px solid var(--border);
    }
    .pane:last-child { border-right: none; }
    .pane-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
    }
    .pane-title { font-weight: bold; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; color: #888; }
    textarea {
      flex: 1; background: #1a1a1a; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 15px; font-family: 'Courier New', Courier, monospace;
      font-size: 14px; resize: none; outline: none; transition: border 0.3s;
    }
    textarea:focus { border-color: var(--accent); }
    .output-area {
      flex: 1; background: #1a1a1a; border: 1px solid var(--border); border-radius: 6px;
      padding: 15px; overflow-y: auto; font-size: 14px; position: relative; line-height: 1.5;
    }
    pre { background: #111; padding: 15px; border-radius: 6px; overflow-x: auto; margin-top: 5px;}
    code { font-family: 'Courier New', Courier, monospace; }
    button {
      background: var(--accent); color: #000; border: none; padding: 8px 16px;
      border-radius: 4px; cursor: pointer; font-weight: bold; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.8; }
    button:disabled { background: #555; cursor: not-allowed; color: #888; }
    .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-clear:hover { background: #333; opacity: 1; }
    .copy-btn {
      position: absolute; top: 20px; right: 25px; background: #333; color: #fff;
      font-size: 12px; padding: 4px 10px; display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>SAQL Optimizer</h1>
    <button id="optimizeBtn">Optimize Query</button>
  </header>

  <div class="container">
    <!-- Input Pane -->
    <div class="pane">
      <div class="pane-header">
        <span class="pane-title">Input SAQL</span>
        <button class="btn-clear" id="clearBtn">Clear</button>
      </div>
      <textarea id="inputQuery" placeholder="Paste your complex SAQL query here..."></textarea>
    </div>

    <!-- Output Pane -->
    <div class="pane">
      <div class="pane-header">
        <span class="pane-title">Optimized Output</span>
      </div>
      <div class="output-area" id="outputArea">
        <button class="copy-btn" id="copyBtn">Copy Code</button>
        <div id="outputContent">Waiting for input...</div>
      </div>
    </div>
  </div>

  <script>
    const inputQuery = document.getElementById('inputQuery');
    const outputContent = document.getElementById('outputContent');
    const optimizeBtn = document.getElementById('optimizeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    let latestCode = "";

    clearBtn.addEventListener('click', () => {
      inputQuery.value = '';
      outputContent.innerHTML = 'Waiting for input...';
      copyBtn.style.display = 'none';
      latestCode = '';
    });

    copyBtn.addEventListener('click', async () => {
      if (latestCode) {
        await navigator.clipboard.writeText(latestCode);
        const originalText = copyBtn.innerText;
        copyBtn.innerText = 'Copied!';
        copyBtn.style.background = 'var(--success)';
        copyBtn.style.color = '#000';
        setTimeout(() => {
          copyBtn.innerText = originalText;
          copyBtn.style.background = '#333';
          copyBtn.style.color = '#fff';
        }, 2000);
      }
    });

    optimizeBtn.addEventListener('click', async () => {
      const query = inputQuery.value.trim();
      
      if (!query) {
        alert("Please enter a SAQL query first.");
        return;
      }

      optimizeBtn.disabled = true;
      optimizeBtn.innerText = 'Optimizing...';
      outputContent.innerHTML = '<span style="color: #888;">Analyzing and optimizing SAQL...</span>';
      copyBtn.style.display = 'none';
      latestCode = '';

      try {
        // Calling our new serverless backend instead of the Gemini API directly
        const response = await fetch('/api/optimize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Server error occurred');
        }

        const markdownText = data.result;
        
        // Simple markdown parsing to format the output and extract the code block
        const formattedHtml = markdownText
          .replace(/```saql\n([\s\S]*?)```/g, (match, p1) => {
            latestCode = p1.trim();
            return `<pre><code>${p1.trim()}</code></pre>`;
          })
          .replace(/```\w*\n([\s\S]*?)```/g, (match, p1) => `<pre><code>${p1.trim()}</code></pre>`)
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/\n/g, '<br>');

        outputContent.innerHTML = formattedHtml;
        
        if (latestCode) {
          copyBtn.style.display = 'block';
        }

      } catch (error) {
        outputContent.innerHTML = `<span style="color: var(--error);">Error: ${error.message}</span>`;
      } finally {
        optimizeBtn.disabled = false;
        optimizeBtn.innerText = 'Optimize Query';
      }
    });
  </script>
</body>
</html>
